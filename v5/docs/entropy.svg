<text x="60" y="394" font-size="12" fill="#818384">each bar = one feedback pattern &#183; bar height = how many candidates land there</text>
<rect x="40" y="430" width="820" height="46" rx="10" fill="#1a1a1b" stroke="#3a3a3c"/>
<text x="60" y="460" font-size="17" fill="#ffffff" font-weight="700">H = &#8722; &#931; p&#7522; &#183; log&#8322;(p&#7522;)</text>
<text x="300" y="452" font-size="13" fill="#818384">&#8776; 4.88 bits of expected information</text>
<text x="300" y="469" font-size="13" fill="#818384">the solver maximises H each turn &#160;&#183;&#160; 1 bit = the field halved</text>
