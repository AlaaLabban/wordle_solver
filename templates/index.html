<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlWird Solver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:           #121213;
  --tile-empty:   #121213;
  --tile-border:  #3a3a3c;
  --tile-filled:  #565758;
  --green:        #538d4e;
  --yellow:       #b59f3b;
  --gray-tile:    #3a3a3c;
  --text:         #ffffff;
  --muted:        #818384;
  --card:         #1a1a1b;
  --green-hover:  #6aac63;
  --font:         'Clear Sans','Helvetica Neue',Arial,sans-serif;
  --font-ar:      'Noto Sans Arabic','Clear Sans',sans-serif;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── Header ── */
header {
  width: 100%;
  max-width: 500px;
  display: flex;
  flex-direction: column;
  align-items: center;
  border-bottom: 1px solid var(--tile-border);
  padding: 14px 0 10px;
  margin-bottom: 18px;
}
header h1 {
  font-size: 1.9rem;
  font-weight: 700;
  letter-spacing: .18rem;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.sub {
  font-size: .72rem;
  color: var(--muted);
  letter-spacing: .06rem;
  margin-bottom: 10px;
}

/* ── Main ── */
main { width: 100%; max-width: 500px; padding: 0 16px 60px; }

/* ── Tiles ── */
[data-color="green"]  { background: var(--green)!important;     border-color: var(--green)!important; }
[data-color="yellow"] { background: var(--yellow)!important;    border-color: var(--yellow)!important; }
[data-color="gray"]   { background: var(--gray-tile)!important; border-color: var(--gray-tile)!important; }

.tile {
  width: 52px; height: 52px;
  border: 2px solid var(--tile-border);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.45rem; font-weight: 700;
  font-family: var(--font-ar);
  color: var(--text);
  user-select: none;
  transition: background .2s, border-color .2s;
}
.tile-row { display: flex; gap: 5px; justify-content: center; direction: rtl; }

/* Feedback tiles */
.fb-tile { cursor: pointer; border-color: var(--tile-filled); }
.fb-tile:hover { opacity: .82; }

/* History tiles */
.h-tile { width: 42px; height: 42px; font-size: 1.15rem; }

/* Trace tiles */
.t-tile {
  width: 36px; height: 36px;
  border: 2px solid var(--tile-border);
  border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  font-size: .95rem; font-weight: 700;
  font-family: var(--font-ar);
  color: var(--text);
}

/* ── Status / info ── */
.status {
  text-align: center;
  color: var(--muted);
  font-size: .82rem;
  margin: 8px 0;
  min-height: 1.2em;
  letter-spacing: .03rem;
}

/* ── Progress bar ── */
.prog-label {
  font-size: .72rem;
  color: var(--muted);
  text-align: center;
  margin: 4px 0 2px;
  min-height: 1em;
  letter-spacing: .02rem;
}
.prog-wrap {
  width: 100%;
  height: 5px;
  background: var(--tile-border);
  border-radius: 3px;
  margin: 8px 0;
  overflow: hidden;
}
.prog-fill {
  height: 100%;
  background: var(--green);
  border-radius: 3px;
  width: 0%;
  transition: width .35s ease;
}

/* ── Suggestions ── */
.section-label {
  font-size: .66rem;
  letter-spacing: .1rem;
  text-transform: uppercase;
  color: var(--muted);
  margin: 14px 0 6px;
}
.sug-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: var(--card);
  border: 1px solid var(--tile-border);
  border-radius: 4px;
  margin-bottom: 4px;
  cursor: pointer;
  transition: border-color .15s;
}
.sug-item:hover { border-color: var(--green); }
.sug-item.best  { border-color: var(--green); }
.sug-rank  { color: var(--muted); font-size: .72rem; min-width: 14px; }
.sug-star  { font-size: .9rem; color: var(--muted); min-width: 14px; }
.sug-star.cand { color: var(--green); }
.sug-word {
  font-family: var(--font-ar);
  font-size: 1.25rem;
  font-weight: 700;
  direction: rtl;
  flex: 1;
  letter-spacing: 0;
}
.sug-stats { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
.sug-ent   { font-size: .8rem; font-weight: 700; color: var(--text); }
.sug-elim  { font-size: .68rem; color: var(--muted); }

/* ── Mode menu ── */
.mode-menu {
  display: flex;
  flex-direction: column;
  gap: 7px;
  width: 100%;
  margin-top: 10px;
}
.mode-group { display: flex; flex-direction: column; gap: 4px; }
.mode-group-label {
  font-size: .55rem;
  letter-spacing: .12rem;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
}
.mode-group-note { font-size: .52rem; letter-spacing: .04rem; text-transform: none; opacity: .7; }
.mode-btns { display: flex; gap: 5px; flex-wrap: wrap; }
.mode-btn {
  flex: 1;
  min-width: 90px;
  padding: 7px 8px;
  background: var(--bg);
  border: 1px solid var(--tile-border);
  border-radius: 4px;
  color: var(--muted);
  font-size: .7rem;
  font-weight: 700;
  letter-spacing: .04rem;
  cursor: pointer;
  transition: border-color .15s, color .15s, background .15s;
  text-align: center;
}
.mode-btn:hover { border-color: var(--green); color: var(--text); }
.mode-btn.selected { background: var(--green); border-color: var(--green); color: var(--text); }
.mode-divider {
  border: none; border-top: 1px solid var(--tile-border); margin: 2px 0;
}

/* ── Mode badge shown in game panes ── */
.mode-badge {
  display: inline-block;
  font-size: .6rem;
  font-weight: 700;
  letter-spacing: .08rem;
  text-transform: uppercase;
  background: var(--tile-border);
  color: var(--muted);
  border-radius: 3px;
  padding: 2px 7px;
  margin-bottom: 8px;
}
.mode-badge.hard   { background: var(--yellow); color: #121213; }
.mode-badge.legacy { border: 1px solid var(--yellow); }

/* ── Divider ── */
hr { border: none; border-top: 1px solid var(--tile-border); margin: 14px 0; }

/* ── Text inputs ── */
.ar-input {
  width: 100%;
  background: var(--bg);
  border: 2px solid var(--tile-border);
  border-radius: 4px;
  color: var(--text);
  font-family: var(--font-ar);
  font-size: 1.1rem;
  padding: 9px 13px;
  direction: rtl;
  outline: none;
  transition: border-color .15s;
  letter-spacing: 0;
}
.ar-input:focus { border-color: var(--green); }
.ar-input::placeholder { color: var(--muted); font-size: .9rem; }

/* ── Feedback label ── */
.fb-label {
  font-size: .66rem;
  letter-spacing: .1rem;
  text-transform: uppercase;
  color: var(--muted);
  text-align: center;
  margin: 10px 0 5px;
}

/* ── Buttons ── */
.btn-row { display: flex; gap: 8px; margin-top: 12px; }
.btn {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  font-size: .82rem;
  font-weight: 700;
  letter-spacing: .08rem;
  text-transform: uppercase;
  transition: background .15s, opacity .15s;
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-green  { background: var(--green);       color: var(--text); }
.btn-green:not(:disabled):hover { background: var(--green-hover); }
.btn-dark   { background: var(--tile-border); color: var(--muted); }
.btn-dark:not(:disabled):hover  { background: #555; color: var(--text); }

/* ── Guess history ── */
#guess-history { margin-bottom: 6px; }
.h-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}
.h-tiles { display: flex; gap: 4px; direction: rtl; }
.h-meta  { flex: 1; display: flex; flex-direction: column; gap: 1px; }
.h-word  { font-family: var(--font-ar); font-size: .95rem; font-weight: 700; direction: rtl; text-align: right; }
.h-stats { font-size: .65rem; color: var(--muted); }

/* ── Auto pane ── */
.auto-row { display: flex; gap: 8px; margin-bottom: 12px; }
.auto-row .ar-input { flex: 1; }
.btn-solve {
  background: var(--green); color: var(--text);
  border: none; border-radius: 4px; cursor: pointer;
  font-size: .82rem; font-weight: 700; letter-spacing: .06rem;
  text-transform: uppercase; padding: 9px 18px;
  transition: background .15s, opacity .15s;
  flex-shrink: 0;
}
.btn-solve:not(:disabled):hover { background: var(--green-hover); }
.btn-solve:disabled { opacity: .45; cursor: not-allowed; }

.result-banner {
  text-align: center;
  padding: 12px;
  border-radius: 4px;
  font-weight: 700;
  letter-spacing: .05rem;
  margin-bottom: 10px;
}
.banner-win  { background: var(--green); }
.banner-lose { background: #b55; }

.trace-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: var(--card);
  border: 1px solid var(--tile-border);
  border-radius: 4px;
  margin-bottom: 5px;
}
.trace-n    { color: var(--muted); font-size: .7rem; min-width: 20px; }
.trace-tiles { display: flex; gap: 3px; direction: rtl; }
.trace-meta  { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.trace-word  { font-family: var(--font-ar); font-size: .95rem; font-weight: 700; direction: rtl; text-align: right; }
.trace-stats { font-size: .65rem; color: var(--muted); }

/* ── Toast ── */
#toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  background: #fff;
  color: #121213;
  padding: 10px 22px;
  border-radius: 4px;
  font-weight: 700;
  font-size: .82rem;
  opacity: 0;
  transition: opacity .3s;
  z-index: 999;
  pointer-events: none;
  white-space: nowrap;
}
#toast.show { opacity: 1; }

[hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>AlWird Solver</h1>
  <p class="sub" id="sub-info">Loading…</p>
  <div class="mode-menu">
    <div class="mode-group">
      <span class="mode-group-label">Interactive</span>
      <div class="mode-btns">
        <button class="mode-btn selected"
                data-type="interactive" data-legacy="false" data-hard="false"
                onclick="selectMode(this)">1a · Normal</button>
        <button class="mode-btn"
                data-type="interactive" data-legacy="false" data-hard="true"
                onclick="selectMode(this)">1b · Hard</button>
      </div>
    </div>
    <div class="mode-group">
      <span class="mode-group-label">Automatic</span>
      <div class="mode-btns">
        <button class="mode-btn"
                data-type="auto" data-legacy="false" data-hard="false"
                onclick="selectMode(this)">2a · Normal</button>
        <button class="mode-btn"
                data-type="auto" data-legacy="false" data-hard="true"
                onclick="selectMode(this)">2b · Hard</button>
      </div>
    </div>
    <hr class="mode-divider">
    <div class="mode-group">
      <span class="mode-group-label">Legacy
        <span class="mode-group-note">(slower, more thorough — searches all 120k words)</span>
      </span>
      <div class="mode-btns">
        <button class="mode-btn"
                data-type="interactive" data-legacy="true" data-hard="false"
                onclick="selectMode(this)">3a · Int Normal</button>
        <button class="mode-btn"
                data-type="interactive" data-legacy="true" data-hard="true"
                onclick="selectMode(this)">3b · Int Hard</button>
        <button class="mode-btn"
                data-type="auto" data-legacy="true" data-hard="false"
                onclick="selectMode(this)">3c · Aut Normal</button>
        <button class="mode-btn"
                data-type="auto" data-legacy="true" data-hard="true"
                onclick="selectMode(this)">3d · Aut Hard</button>
      </div>
    </div>
  </div>
</header>

<main>

  <!-- ══ Interactive pane ══ -->
  <section id="pane-interactive">

    <div id="mode-badge-int" class="mode-badge" style="display:none"></div>
    <div id="guess-history"></div>

    <p class="status" id="status-bar">Click "New Game" to start</p>

    <p class="prog-label" id="prog-label" hidden></p>
    <div class="prog-wrap" id="prog-wrap" hidden>
      <div class="prog-fill" id="prog-fill"></div>
    </div>

    <div id="sug-container" hidden>
      <p class="section-label">Top suggestions — click to use</p>
      <div id="sug-list"></div>
    </div>

    <hr>

    <input class="ar-input" id="guess-input" type="text" maxlength="10"
           placeholder="اكتب تخمينك هنا…" autocomplete="off" autocorrect="off" spellcheck="false">

    <p class="fb-label">Click tiles to set feedback &nbsp;·&nbsp; ⬜ Gray &nbsp; 🟨 Yellow &nbsp; 🟩 Green</p>

    <div class="tile-row" id="fb-row">
      <div class="tile fb-tile" data-state="0" onclick="cycleTile(this)"></div>
      <div class="tile fb-tile" data-state="0" onclick="cycleTile(this)"></div>
      <div class="tile fb-tile" data-state="0" onclick="cycleTile(this)"></div>
      <div class="tile fb-tile" data-state="0" onclick="cycleTile(this)"></div>
      <div class="tile fb-tile" data-state="0" onclick="cycleTile(this)"></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-green" id="btn-submit" onclick="submitGuess()" disabled>Submit</button>
      <button class="btn btn-dark"  id="btn-new"    onclick="newGame()">New Game</button>
    </div>

  </section>

  <!-- ══ Auto pane ══ -->
  <section id="pane-auto" hidden>

    <div id="mode-badge-aut" class="mode-badge" style="display:none"></div>
    <div class="auto-row">
      <input class="ar-input" id="answer-input" type="text" maxlength="10"
             placeholder="أدخل الكلمة السرية…" autocomplete="off" autocorrect="off" spellcheck="false">
      <button class="btn-solve" id="btn-solve" onclick="runAuto()">Solve</button>
    </div>

    <p class="prog-label" id="auto-prog-label" hidden></p>
    <div class="prog-wrap" id="auto-prog-wrap" hidden>
      <div class="prog-fill" id="auto-prog-fill"></div>
    </div>

    <div id="auto-result"></div>
    <div id="auto-trace"></div>

  </section>

</main>

<div id="toast"></div>

<script>
'use strict';

// ── State ──────────────────────────────────────────────────────────────────
let gameActive  = false;
let computing   = false;
let maxAttempts = 8;
let currentMode = { type: 'interactive', legacy: false, hard: false };

// ── Init ───────────────────────────────────────────────────────────────────
fetch('/api/info').then(r => r.json()).then(d => {
  document.getElementById('sub-info').textContent =
    `${d.word_count.toLocaleString()} words · opener: ${d.opener}`;
  maxAttempts = d.max_attempts || 8;
}).catch(() => {
  document.getElementById('sub-info').textContent = 'AlWird Entropy Solver';
});
updateModeBadge();

// ── Mode selection ─────────────────────────────────────────────────────────
function selectMode(btn) {
  if (computing) return;
  const type   = btn.dataset.type;
  const legacy = btn.dataset.legacy === 'true';
  const hard   = btn.dataset.hard   === 'true';
  currentMode  = { type, legacy, hard };

  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');

  document.getElementById('pane-interactive').hidden = type !== 'interactive';
  document.getElementById('pane-auto').hidden        = type !== 'auto';

  // Reset game state when mode changes
  gameActive = false;
  document.getElementById('btn-submit').disabled = true;
  setStatus('Click "New Game" to start');
  document.getElementById('guess-history').innerHTML = '';
  document.getElementById('sug-container').hidden = true;
  showProg(false);
  resetFbTiles();
  document.getElementById('guess-input').value = '';

  updateModeBadge();
}

function updateModeBadge() {
  ['int', 'aut'].forEach(id => {
    const badge = document.getElementById(`mode-badge-${id}`);
    const isInt = id === 'int';
    if ((isInt && currentMode.type === 'interactive') ||
        (!isInt && currentMode.type === 'auto')) {
      const parts = [];
      if (currentMode.legacy) parts.push('Legacy');
      if (currentMode.hard)   parts.push('Hard');
      if (!parts.length)      parts.push('Normal');
      badge.textContent = parts.join(' · ');
      badge.className = 'mode-badge' +
        (currentMode.hard   ? ' hard'   : '') +
        (currentMode.legacy ? ' legacy' : '');
      badge.style.display = '';
    } else {
      badge.style.display = 'none';
    }
  });
}

// ── Feedback tiles ─────────────────────────────────────────────────────────
const STATE_COLOR = [null, 'yellow', 'green'];

function cycleTile(tile) {
  if (!gameActive || computing) return;
  applyTileState(tile, (parseInt(tile.dataset.state) + 1) % 3);
}

function applyTileState(tile, state) {
  tile.dataset.state = state;
  if (state === 0) tile.removeAttribute('data-color');
  else             tile.dataset.color = STATE_COLOR[state];
}

function resetFbTiles() {
  document.querySelectorAll('#fb-row .fb-tile').forEach(t => {
    applyTileState(t, 0);
    t.textContent = '';
  });
}

function getPattern() {
  return [...document.querySelectorAll('#fb-row .fb-tile')].map(t => parseInt(t.dataset.state));
}

// Mirror input letters into feedback tiles
document.getElementById('guess-input').addEventListener('input', function () {
  const tiles = document.querySelectorAll('#fb-row .fb-tile');
  tiles.forEach((t, i) => { t.textContent = this.value[i] || ''; });
});

// ── New Game ───────────────────────────────────────────────────────────────
async function newGame() {
  if (computing) return;
  setBusy(true);
  try {
    const r = await post('/api/start', { legacy: currentMode.legacy, hard: currentMode.hard });
    if (!r.ok) { toast((await r.json()).error || 'Error'); return; }
    const d = await r.json();

    gameActive = true;
    document.getElementById('guess-history').innerHTML = '';
    document.getElementById('guess-input').value = '';
    resetFbTiles();
    document.getElementById('sug-container').hidden = true;
    setStatus(`Attempt 1 / ${d.max_attempts}  ·  ${fmt(d.candidates_remaining)} candidates`);

    showSuggestions([{
      word: d.opener,
      entropy: d.opener_entropy,
      expected_remaining: d.expected_remaining,
      words_eliminated: d.words_eliminated,
      is_candidate: true,
    }]);

    document.getElementById('btn-submit').disabled = false;
  } finally {
    setBusy(false);
  }
}

// ── Submit guess ───────────────────────────────────────────────────────────
async function submitGuess() {
  if (!gameActive || computing) return;

  const guess   = document.getElementById('guess-input').value.trim();
  const pattern = getPattern();
  if (!guess) { toast('Enter a guess first'); return; }

  computing = true;
  document.getElementById('btn-submit').disabled = true;
  document.getElementById('sug-container').hidden = true;

  try {
    const r = await post('/api/submit', { guess, pattern });
    const d = await r.json();
    if (!r.ok) { toast(d.error || 'Error'); return; }

    appendHistory(guess, pattern, d);
    document.getElementById('guess-input').value = '';
    resetFbTiles();

    if (d.status === 'solved') {
      setStatus(`🎉  Solved in ${d.attempt} attempt${d.attempt !== 1 ? 's' : ''}!`);
      gameActive = false;
      return;
    }
    if (d.status === 'failed' || d.status === 'no_candidates') {
      setStatus(d.message || 'Game over.');
      gameActive = false;
      return;
    }

    setStatus(`Attempt ${d.attempt} / ${d.max_attempts}  ·  ${fmt(d.candidates_remaining)} candidates`);
    showProg(true);

    pollJob(d.job_id,
      (pct, cur, tot) => setProgPct(pct, cur, tot),
      result => {
        showProg(false);
        if (result.suggestions) showSuggestions(result.suggestions);
        document.getElementById('btn-submit').disabled = false;
        computing = false;
      }
    );
  } catch (e) {
    toast('Network error');
    document.getElementById('btn-submit').disabled = false;
    computing = false;
  }
}

// ── Guess history row ──────────────────────────────────────────────────────
function appendHistory(guess, pattern, data) {
  const hist = document.getElementById('guess-history');
  const row  = document.createElement('div');
  row.className = 'h-row';

  const tiles = document.createElement('div');
  tiles.className = 'h-tiles';
  const cmap = ['gray', 'yellow', 'green'];
  for (let i = 0; i < 5; i++) {
    const t = document.createElement('div');
    t.className = 'tile h-tile';
    t.dataset.color = cmap[pattern[i]];
    t.textContent = guess[i] || '';
    tiles.appendChild(t);
  }

  const meta = document.createElement('div');
  meta.className = 'h-meta';
  const wEl = document.createElement('div');
  wEl.className = 'h-word';
  wEl.textContent = guess;
  const sEl = document.createElement('div');
  sEl.className = 'h-stats';
  // Stats come from the server echo in data (if present) or just show the guess
  if (data && data.entropy != null) {
    sEl.textContent = `H=${data.entropy?.toFixed(2)}  ·  ~${fmt(data.words_eliminated)} eliminated  ·  ~${data.expected_remaining} left`;
  }
  meta.appendChild(wEl);
  if (sEl.textContent) meta.appendChild(sEl);
  row.appendChild(tiles);
  row.appendChild(meta);
  hist.appendChild(row);
}

// ── Suggestions ────────────────────────────────────────────────────────────
function showSuggestions(sugs) {
  const list = document.getElementById('sug-list');
  list.innerHTML = '';
  sugs.forEach((s, i) => {
    const item = document.createElement('div');
    item.className = `sug-item${i === 0 ? ' best' : ''}`;
    item.onclick = () => {
      document.getElementById('guess-input').value = s.word;
      document.querySelectorAll('#fb-row .fb-tile').forEach((t, j) => {
        t.textContent = s.word[j] || '';
      });
    };

    const rank   = el('span', 'sug-rank', i + 1);
    const star   = el('span', `sug-star${s.is_candidate ? ' cand' : ''}`, s.is_candidate ? '★' : '◇');
    const word   = el('span', 'sug-word', s.word);
    word.dir     = 'rtl';

    const stats  = document.createElement('div');
    stats.className = 'sug-stats';
    stats.appendChild(el('span', 'sug-ent',  `H = ${s.entropy?.toFixed(3)}`));
    stats.appendChild(el('span', 'sug-elim', `~${fmt(s.words_eliminated)} eliminated  ·  ~${s.expected_remaining} left`));

    item.append(rank, star, word, stats);
    list.appendChild(item);
  });
  document.getElementById('sug-container').hidden = false;
}

// ── Auto mode ──────────────────────────────────────────────────────────────
async function runAuto() {
  const answer = document.getElementById('answer-input').value.trim();
  if (!answer) { toast('Enter an answer word'); return; }
  if (computing) return;

  computing = true;
  document.getElementById('btn-solve').disabled = true;
  document.getElementById('auto-result').innerHTML = '';
  document.getElementById('auto-trace').innerHTML  = '';
  showAutoProg(true);

  try {
    const r = await post('/api/auto', { answer, legacy: currentMode.legacy, hard: currentMode.hard });
    if (!r.ok) { toast((await r.json()).error || 'Error'); return; }
    const d = await r.json();

    pollJob(d.job_id,
      (pct, cur, tot) => setAutoProgPct(pct, cur, tot),
      result => {
        showAutoProg(false);
        renderAutoResult(result);
        document.getElementById('btn-solve').disabled = false;
        computing = false;
      }
    );
  } catch (e) {
    toast('Network error');
    document.getElementById('btn-solve').disabled = false;
    showAutoProg(false);
    computing = false;
  }
}

function renderAutoResult(data) {
  const resDiv = document.getElementById('auto-result');
  const banner = document.createElement('div');
  banner.className = `result-banner ${data.solved ? 'banner-win' : 'banner-lose'}`;
  banner.textContent = data.solved
    ? `✓  Solved in ${data.attempts} guess${data.attempts !== 1 ? 'es' : ''}!`
    : `✗  Failed after ${data.attempts} guesses`;
  resDiv.appendChild(banner);

  const traceDiv = document.getElementById('auto-trace');
  const cmap = ['gray', 'yellow', 'green'];

  for (const turn of (data.trace || [])) {
    const row = document.createElement('div');
    row.className = 'trace-row';

    const nEl = document.createElement('div');
    nEl.className = 'trace-n';
    nEl.textContent = turn.attempt;

    const tiles = document.createElement('div');
    tiles.className = 'trace-tiles';
    for (let i = 0; i < 5; i++) {
      const t = document.createElement('div');
      t.className = 't-tile';
      t.dataset.color = cmap[turn.pattern[i]];
      t.textContent = turn.guess[i] || '';
      tiles.appendChild(t);
    }

    const meta  = document.createElement('div');
    meta.className = 'trace-meta';
    const wEl   = el('div', 'trace-word', turn.guess);
    const sEl   = el('div', 'trace-stats',
      `H=${turn.entropy?.toFixed(2)}  ·  ~${fmt(turn.words_eliminated)} eliminated  ·  ~${turn.expected_remaining} left  ·  ${fmt(turn.candidates_before)} candidates`);
    meta.appendChild(wEl);
    meta.appendChild(sEl);

    row.append(nEl, tiles, meta);
    traceDiv.appendChild(row);
  }
}

// ── Polling ────────────────────────────────────────────────────────────────
function pollJob(jobId, onProgress, onDone) {
  const t = setInterval(async () => {
    try {
      const r = await fetch(`/api/status/${jobId}`);
      const d = await r.json();
      if (d.progress != null) onProgress(d.progress, d.progress_current, d.progress_total);
      if (d.status === 'done')  { clearInterval(t); onDone(d); }
      if (d.status === 'error') {
        clearInterval(t);
        showProg(false); showAutoProg(false);
        toast(d.message || 'Computation error');
        computing = false;
        document.getElementById('btn-submit').disabled = false;
        document.getElementById('btn-solve').disabled  = false;
      }
    } catch (_) { clearInterval(t); computing = false; }
  }, 1000);
}

// ── UI helpers ─────────────────────────────────────────────────────────────
function setStatus(msg) { document.getElementById('status-bar').textContent = msg; }
function setBusy(on)    { document.getElementById('btn-new').disabled = on; }

function showProg(on) {
  document.getElementById('prog-wrap').hidden  = !on;
  document.getElementById('prog-label').hidden = !on;
  if (!on) setProgPct(0, null, null);
}
function setProgPct(pct, cur, tot) {
  document.getElementById('prog-fill').style.width = pct + '%';
  const lbl = document.getElementById('prog-label');
  if (cur != null && tot != null && tot > 0)
    lbl.textContent = `${fmt(cur)} / ${fmt(tot)} words`;
}

function showAutoProg(on) {
  document.getElementById('auto-prog-wrap').hidden  = !on;
  document.getElementById('auto-prog-label').hidden = !on;
  if (!on) setAutoProgPct(0, null, null);
}
function setAutoProgPct(pct, cur, tot) {
  document.getElementById('auto-prog-fill').style.width = pct + '%';
  const lbl = document.getElementById('auto-prog-label');
  if (cur != null && tot != null && tot > 0)
    lbl.textContent = `${fmt(cur)} / ${fmt(tot)} words`;
}

function el(tag, cls, text) {
  const e = document.createElement(tag);
  e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function fmt(n) {
  if (n == null) return '?';
  return Math.round(n).toLocaleString();
}

async function post(url, body) {
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
}

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}
</script>
